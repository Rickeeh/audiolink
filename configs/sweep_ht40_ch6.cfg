# TX em modo sweep (ver s_sweep[] em bench/main/bench_main.c): ciclo infinito de
# 8 pontos de operacao, para o TX ficar longe/a bateria e o RX documentar tudo.
# HT40 em ambos (a largura de banda e fixada no arranque).
CONFIG_AUDIOLINK_TRANSPORT_ESPNOW=y
CONFIG_AUDIOLINK_TX_SWEEP=y
CONFIG_AUDIOLINK_ESPNOW_PHYMODE_HT40=y
CONFIG_AUDIOLINK_ESPNOW_RATE_MCS7_SGI=y
CONFIG_AUDIOLINK_WIFI_CHANNEL=6
CONFIG_AUDIOLINK_TX_POWER_QDBM=84
