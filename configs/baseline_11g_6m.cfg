# Baseline minimo: se ISTO nao funcionar, o problema nao e HT40/MCS7 mas o
# proprio link (canal, MAC, antena, distancia). 0.32 Mbps, 10 s.
CONFIG_AUDIOLINK_TRANSPORT_ESPNOW=y
CONFIG_AUDIOLINK_ESPNOW_PHYMODE_11G=y
CONFIG_AUDIOLINK_ESPNOW_RATE_6M=y
CONFIG_AUDIOLINK_WIFI_CHANNEL=6
CONFIG_AUDIOLINK_PAYLOAD_SIZE=200
CONFIG_AUDIOLINK_TX_INTERVAL_US=5000
CONFIG_AUDIOLINK_TEST_DURATION_S=10
