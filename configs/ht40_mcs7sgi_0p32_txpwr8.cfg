# HT40 MCS7 SGI com TX a 2 dBm (minimo): testa a hipotese de saturacao do recetor a curta distancia.
CONFIG_AUDIOLINK_TRANSPORT_ESPNOW=y
CONFIG_AUDIOLINK_ESPNOW_PHYMODE_HT40=y
CONFIG_AUDIOLINK_ESPNOW_RATE_MCS7_SGI=y
CONFIG_AUDIOLINK_WIFI_CHANNEL=6
CONFIG_AUDIOLINK_PAYLOAD_SIZE=200
CONFIG_AUDIOLINK_TX_INTERVAL_US=5000
CONFIG_AUDIOLINK_TEST_DURATION_S=10
CONFIG_AUDIOLINK_TX_POWER_QDBM=8
