# Comparacao rigorosa ESP-NOW vs SoftAP+UDP no MESMO link e ao mesmo tempo (perfil 3):
# passos alternados ESP-NOW(11g 6M) / UDP(auto) / ESP-NOW(HT20 MCS0) / UDP(auto), 1.92 Mbps, 30 s cada.
# Largura de banda 20 MHz em AP e STA. O peer ESP-NOW do TX e o BSSID do AP (descoberto na associacao).
CONFIG_AUDIOLINK_TRANSPORT_DUAL=y
CONFIG_AUDIOLINK_TX_SWEEP=y
CONFIG_AUDIOLINK_SWEEP_PROFILE=3
CONFIG_AUDIOLINK_ESPNOW_PHYMODE_HT20=y
CONFIG_AUDIOLINK_ESPNOW_RATE_MCS0_LGI=y
CONFIG_AUDIOLINK_WIFI_CHANNEL=6
CONFIG_AUDIOLINK_TX_POWER_QDBM=84
