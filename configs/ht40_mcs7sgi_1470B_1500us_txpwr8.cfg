# Payload ESP-NOW v2 maximo (1470 B) a ~7.84 Mbps (2x o alvo de 3.84 Mbps do brief), 20 s,
# HT40 MCS7 SGI, TX a 2 dBm (a potencia maxima falha a curta distancia - ver run 003/005).
CONFIG_AUDIOLINK_TRANSPORT_ESPNOW=y
CONFIG_AUDIOLINK_ESPNOW_PHYMODE_HT40=y
CONFIG_AUDIOLINK_ESPNOW_RATE_MCS7_SGI=y
CONFIG_AUDIOLINK_WIFI_CHANNEL=6
CONFIG_AUDIOLINK_TX_POWER_QDBM=8
CONFIG_AUDIOLINK_PAYLOAD_SIZE=1470
CONFIG_AUDIOLINK_TX_INTERVAL_US=1500
CONFIG_AUDIOLINK_TEST_DURATION_S=20
